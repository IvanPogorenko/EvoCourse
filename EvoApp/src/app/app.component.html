<section class="date">
  <div class="container date__container">
    <div class="col-xs-12 col-12 col-md-4 form-group mb-3">
      <input type="text"
             placeholder="Datepicker"
             class="form-control"
             bsDatepicker
             [(ngModel)]="inputDate">
    </div>
    <button type="button" class="btn btn-primary" (click)="checkDate()">
      Apply
    </button>
  </div>
</section>
