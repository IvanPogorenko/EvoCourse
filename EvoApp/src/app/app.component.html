<div>
  <ul>
    <li *ngFor="let dog of dogs; index as i" [id]="dog.name">
      {{i}}. {{ dog.name }}
    </li>
  </ul>
  <p>{{date | date: 'dd/MM/yyyy'}}</p>
  <p>{{10 | plusNumber}} Добавит 5</p>
  <p>{{"10" | plusNumber}} Преобразует и добавит 5</p>
  <p>{{"sss" | plusNumber}} Ничего нет</p>
</div>
