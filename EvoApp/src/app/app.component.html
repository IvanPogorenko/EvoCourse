<div class="container todo">
  <h1>TODO Items</h1>
  <div class="todo__actions">
    <div class="col-auto">
      <input type="text" class="form-control" placeholder="Task" #taskName>
    </div>
    <div class="col-auto">
      <button type="button" class="btn btn-primary mb-3" (click)="addTask()">Add</button>
    </div>
  </div>
  <div class="todo__list">
    <ul class="list-group">
      <li class="list-group-item" *ngFor="let task of todoList">
        <div class="form-check todo__list-item">
          <div>
            <input class="form-check-input" type="checkbox" (click)="taskCompleted(task)" [checked]="task.completed">
            <label class="form-check-label" [ngStyle]="{'text-decoration': task.completed ? 'line-through' : 'none'}">
              {{ task.title }}
            </label>
          </div>
          <button type="button" class="btn btn-danger" (click)="deleteTask(task)">Delete</button>
        </div>
      </li>
    </ul>
  </div>
</div>

<router-outlet></router-outlet>
