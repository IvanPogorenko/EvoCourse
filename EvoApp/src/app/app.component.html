<div class="container text-center">
  <div class="row">
    <button type="button" class="btn btn-primary" (click)="onStart()" [disabled]="seqActive || randActive">Start</button>
    <div class="col">
      <p>Sequential numbers</p>
      <button *ngIf="seqActive" type="button" (click)="onStopSeq()" class="btn btn-danger">Stop</button>
      <div *ngFor="let number of seqNumbers" class="number">{{number}}</div>
    </div>
    <div class="col">
      <p>Random numbers</p>
      <button *ngIf="randActive" (click)="onStopRand()" type="button" class="btn btn-danger">Stop</button>
      <div *ngFor="let number of randNumbers" class="number">{{number}}</div>
    </div>
  </div>
</div>

<router-outlet></router-outlet>
